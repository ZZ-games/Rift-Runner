<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rift Runner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:ital,wght@0,500;0,700;1,700&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D canvas; HUD pinned to the safe edges; menus are one console column anchored to the bottom of the screen */
  --ink:#080a1c;
  --ink-2:#11143a;
  --panel:rgba(13,16,42,.84);
  --line:rgba(140,150,255,.22);
  --text:#eef0ff;
  --muted:#959cc9;
  --time:#46f2ff;
  --danger:#ff5b4f;
  --gold:#ffc84a;
  --rift:#b98aff;
  --skin:#7ff6ff;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--time);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.coin-dot{display:inline-block;width:.72em;height:.72em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,var(--gold) 55%,#b9780e);box-shadow:0 0 8px rgba(255,200,74,.7);vertical-align:-.06em;margin-right:.32em}
.fx{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,rgba(255,50,40,0) 48%,rgba(255,50,40,.62) 100%);opacity:0}
#flash{opacity:0;background:#fff}
#flash.go{animation:flash .38s ease-out}
@keyframes flash{from{opacity:1}to{opacity:0}}

/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 16px)}
.col{width:100%;max-width:460px;margin-inline:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
#menu{background:linear-gradient(to top,rgba(8,10,28,.97) 0%,rgba(8,10,28,.88) 44%,rgba(8,10,28,0) 72%),linear-gradient(to bottom,rgba(8,10,28,.6),rgba(8,10,28,0) 26%)}
#menu .col{height:100%}
.kicker{font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.logo{margin:6px 0 0;font-family:var(--f-display);font-style:italic;font-weight:700;font-size:clamp(56px,17vw,104px);line-height:.84;letter-spacing:-.01em;color:var(--text);text-shadow:0 0 18px rgba(70,242,255,.5),0 0 48px rgba(185,138,255,.45)}
.logo span{color:var(--time)}
.spacer{flex:1;min-height:24px}
.profile{display:flex;align-items:center;gap:12px}
.lvl{flex:none;width:48px;height:54px;display:grid;place-items:center;align-content:center;background:var(--gold);color:var(--ink);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-family:var(--f-display);line-height:1}
.lvl small{font-size:9px;font-weight:700;letter-spacing:.14em}
.lvl b{font-size:22px}
.xp{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.xp-row{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rift),var(--time));box-shadow:0 0 10px rgba(70,242,255,.6)}
.wallet{flex:none;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--gold)}
.play-wrap{filter:drop-shadow(0 0 14px rgba(70,242,255,.5));animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 0 24px rgba(70,242,255,.85))}}
.play{display:block;width:100%;height:64px;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:linear-gradient(180deg,#8ff8ff,var(--time));clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);transition:transform .1s}
.play:active{transform:scale(.98)}
.howto{margin:0;font-size:14px;color:var(--muted);text-align:center;text-wrap:balance}
.howto b{color:var(--time);font-weight:600}
.howto em{color:var(--danger);font-style:normal;font-weight:600}
.settings{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.chip:hover{color:var(--text)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.tab{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 4px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--time)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:2px;box-shadow:0 0 8px var(--gold)}
.panel{overflow-y:auto;max-height:min(34vh,300px);min-height:110px;display:flex;flex-direction:column;gap:8px;padding-bottom:2px;scrollbar-width:thin}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.row-main{flex:1;min-width:0}
.row-title{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em}
.row-sub{font-size:13px;color:var(--muted)}
.pips{display:flex;gap:4px;margin-top:7px}
.pips i{width:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
.pips i.on{background:var(--time);box-shadow:0 0 6px var(--time)}
.buy{flex:none;min-width:86px;height:40px;padding-inline:10px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--gold);background:rgba(255,200,74,.1);border:1px solid rgba(255,200,74,.5);border-radius:8px}
.buy:disabled{opacity:.38;cursor:default}
.buy.max{color:var(--time);border-color:rgba(70,242,255,.4);background:rgba(70,242,255,.08)}
.ships{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ship{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.ship.eq{border-color:var(--time);box-shadow:inset 0 0 0 1px var(--time)}
.ship:disabled{opacity:.42;cursor:default}
.chev{width:44px;height:28px;background:var(--c);clip-path:polygon(50% 0,100% 100%,50% 72%,0 100%);filter:drop-shadow(0 0 6px var(--c))}
.ship-name{font-family:var(--f-display);font-weight:700;font-size:14px}
.ship-state{font-size:12px;color:var(--muted)}
.ship.eq .ship-state{color:var(--time)}
.mis{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.mis-text{flex:1;min-width:0;font-weight:500}
.mis-reward{flex:none;font-family:var(--f-display);font-weight:700;color:var(--gold)}
.note{margin:2px 0 0;font-size:13px;color:var(--muted)}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
.hud-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
#pauseBtn{pointer-events:auto;justify-self:start;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:rgba(8,10,28,.55);display:grid;place-items:center}
#pauseBtn::before{content:"";width:12px;height:15px;border-left:4px solid var(--text);border-right:4px solid var(--text)}
.timer-wrap{position:relative;text-align:center}
#timer{font-family:var(--f-display);font-weight:700;font-size:clamp(54px,15vw,76px);line-height:1;color:var(--time);text-shadow:0 0 16px rgba(70,242,255,.65);font-variant-numeric:tabular-nums;display:inline-block}
#timer.warn{color:var(--gold);text-shadow:0 0 16px rgba(255,200,74,.6)}
#timer.low{color:var(--danger);text-shadow:0 0 20px rgba(255,91,79,.85);animation:throb .5s ease-in-out infinite}
#timer.bump{animation:bump .3s ease-out}
@keyframes throb{50%{transform:scale(1.08)}}
@keyframes bump{40%{transform:scale(1.16)}}
.timer-label{font-family:var(--f-display);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
#timeDelta{position:absolute;left:100%;top:10px;margin-left:2px;font-family:var(--f-display);font-weight:700;font-size:20px;white-space:nowrap;opacity:0}
#timeDelta.pos{color:var(--time)}
#timeDelta.neg{color:var(--danger)}
#timeDelta.show{animation:tdelta .9s ease-out forwards}
@keyframes tdelta{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.score-wrap{justify-self:end;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-family:var(--f-display)}
#score{font-weight:700;font-size:26px;line-height:1.05}
.sub{font-size:13px;color:var(--muted);font-weight:500}
.sub.gold{color:var(--gold);font-weight:700;font-size:15px}
#shieldHud{color:var(--skin);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.hud-mid{display:flex;justify-content:center;margin-top:6px}
#combo{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:rgba(8,10,28,.55);border:1px solid var(--line)}
#comboMult{font-family:var(--f-display);font-weight:700;font-size:20px;min-width:2.3em;text-align:center}
#combo.hot{border-color:rgba(255,200,74,.6)}
#combo.hot #comboMult{color:var(--gold);text-shadow:0 0 10px rgba(255,200,74,.7)}
#combo.bump{animation:bump .3s ease-out}
.combo-bar{width:64px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#comboFill{display:block;height:100%;width:0;background:var(--gold)}
#popups{position:absolute;left:0;right:0;top:32%;display:flex;flex-direction:column;align-items:center;gap:2px}
.pop{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:28px;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 0 14px currentColor;animation:pop 1.1s ease-out forwards;white-space:nowrap}
.pop.big{font-size:clamp(34px,10vw,54px)}
@keyframes pop{0%{opacity:0;transform:scale(.5)}12%{opacity:1;transform:scale(1.15)}22%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.t-time{color:var(--time)}.t-gold{color:var(--gold)}.t-danger{color:var(--danger)}.t-rift{color:var(--rift)}.t-white{color:var(--text)}.t-skin{color:var(--skin)}
#toasts{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:center;gap:6px;padding-inline:16px}
.toast{max-width:100%;background:var(--panel);border:1px solid rgba(255,200,74,.55);padding:10px 14px;border-radius:10px;font-size:14px;animation:toast 3s ease forwards;text-align:center}
.toast b{color:var(--gold);font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
@keyframes toast{0%{opacity:0;transform:translateY(14px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#hint{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);text-align:center;font-family:var(--f-display);letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--text);opacity:.85;transition:opacity .6s}
#hint.off{opacity:0}

/* results + pause */
#results,#pause{justify-content:center;background:rgba(8,10,28,.7);overflow-y:auto}
#results .col,#pause .col{margin-block:auto}
.card{background:var(--panel);border:1px solid var(--line);padding:22px 20px;clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);display:flex;flex-direction:column;gap:14px}
.res-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
#rScore{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(54px,16vw,80px);line-height:.95;font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(70,242,255,.4)}
.badge-best{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--gold);padding:6px 10px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);animation:bump .5s ease-out 2}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat span{font-family:var(--f-display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-display);font-weight:700;font-size:22px}
.earn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--gold)}
.earn small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.xp-block{display:flex;align-items:center;gap:12px}
.xp-block .lvl{width:42px;height:48px}
.xp-block .lvl b{font-size:19px}
.levelup{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--gold);text-align:center;text-shadow:0 0 12px rgba(255,200,74,.6);animation:bump .45s ease-out}
.done-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.done-list li{display:flex;gap:8px;font-size:14px}
.done-list li::before{content:"";flex:none;width:8px;height:8px;margin-top:6px;background:var(--gold);transform:rotate(45deg)}
.next-goal{margin:0;font-size:14px;color:var(--muted)}
.next-goal b{color:var(--text);font-weight:600}
.ghost{display:block;width:100%;height:48px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:10px}
.ghost:hover{color:var(--text)}
.btns{display:flex;flex-direction:column;gap:10px}
#pause h2{margin:0;font-family:var(--f-display);font-style:italic;font-weight:700;font-size:44px;text-align:center}
#boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-family:var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);background:var(--ink)}

@media (prefers-reduced-motion:reduce){
  .play-wrap,#timer.low,#timer.bump,#combo.bump,.badge-best,.levelup{animation:none}
  .pop{animation-duration:1.4s}
}
@media (min-height:760px){.panel{max-height:min(38vh,340px)}}
</style>

<canvas id="gl" aria-label="Rift Runner game view"></canvas>
<div id="vig" class="fx"></div>
<div id="flash" class="fx"></div>

<div id="hud" hidden>
  <div class="hud-top">
    <button id="pauseBtn" aria-label="Pause"></button>
    <div class="timer-wrap">
      <div id="timer">20.0</div>
      <div id="timeDelta"></div>
      <div class="timer-label">seconds left</div>
    </div>
    <div class="score-wrap">
      <div id="score" class="num">0</div>
      <div class="sub gold num"><span class="coin-dot"></span><b id="coinsRun">0</b></div>
      <div id="dist" class="sub num">0 m</div>
      <div id="shieldHud"></div>
    </div>
  </div>
  <div class="hud-mid">
    <div id="combo"><span id="comboMult" class="num">x1</span><div class="combo-bar"><i id="comboFill"></i></div></div>
  </div>
  <div id="popups"></div>
  <div id="hint">Drag to steer</div>
  <div id="toasts"></div>
</div>

<section id="menu" class="screen" hidden>
  <div class="col">
    <header>
      <div class="kicker">Neon time-attack</div>
      <h1 class="logo">RIFT<br><span>RUNNER</span></h1>
    </header>
    <div class="spacer"></div>
    <div class="profile">
      <div class="lvl" aria-label="Level"><small>LV</small><b id="mLevel">1</b></div>
      <div class="xp">
        <div class="xp-row"><span id="mXpText" class="num">0 / 120 XP</span><span id="mBest" class="num"></span></div>
        <div class="bar"><i id="mXpFill"></i></div>
      </div>
      <div class="wallet num"><span class="coin-dot"></span><span id="mCoins">0</span></div>
    </div>
    <div class="play-wrap"><button id="playBtn" class="play">Play</button></div>
    <p class="howto">Grab <b>cyan crystals</b> to add time. Hitting a block costs <em>3 seconds</em>.</p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="upgrades" id="tabUp">Upgrades</button>
      <button class="tab" role="tab" data-tab="ships">Ships</button>
      <button class="tab" role="tab" data-tab="missions">Missions</button>
    </div>
    <div id="panel" class="panel" role="tabpanel"></div>
    <div class="settings">
      <button id="soundBtn" class="chip">Sound on</button>
      <button id="qualityBtn" class="chip">Graphics: high</button>
    </div>
  </div>
</section>

<section id="pause" class="screen" hidden>
  <div class="col">
    <div class="card">
      <h2>Paused</h2>
      <div class="btns">
        <div class="play-wrap"><button id="resumeBtn" class="play">Resume</button></div>
        <button id="endBtn" class="ghost">End run</button>
      </div>
    </div>
  </div>
</section>

<section id="results" class="screen" hidden>
  <div class="col">
    <div class="card">
      <div>
        <div class="kicker" id="rKicker">Time up</div>
        <div class="res-head">
          <div id="rScore">0</div>
          <div id="rBest" class="badge-best" hidden>New best</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span>Distance</span><b id="rDist" class="num">0 m</b></div>
        <div class="stat"><span>Crystals</span><b id="rCrys" class="num">0</b></div>
        <div class="stat"><span>Close calls</span><b id="rNear" class="num">0</b></div>
        <div class="stat"><span>Top multiplier</span><b id="rMult" class="num">x1</b></div>
      </div>
      <div class="earn"><span><span class="coin-dot"></span>+<span id="rCoins" class="num">0</span></span><small id="rCoinsNote"></small></div>
      <div class="xp-block">
        <div class="lvl"><small>LV</small><b id="rLevel">1</b></div>
        <div class="xp">
          <div class="xp-row"><span id="rXpGain" class="num">+0 XP</span><span id="rXpText" class="num"></span></div>
          <div class="bar"><i id="rXpFill"></i></div>
        </div>
      </div>
      <div id="rLevelUp" class="levelup" hidden></div>
      <ul id="rMissions" class="done-list"></ul>
      <p id="rNext" class="next-goal"></p>
      <div class="btns">
        <div class="play-wrap"><button id="againBtn" class="play">Run again</button></div>
        <button id="menuBtn" class="ghost">Garage</button>
      </div>
    </div>
  </div>
</section>

<div id="boot">Loading the rift</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';

const A={ctx:null};
function audioInit(){
  if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume().catch(()=>{});return;}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const c=new C();A.ctx=c;
    A.master=c.createGain();A.master.gain.value=save.sound?0.55:0;A.master.connect(c.destination);
    const len=c.sampleRate;const b=c.createBuffer(1,len,c.sampleRate);const d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;A.noise=b;
    A.eng=c.createOscillator();A.eng.type='sawtooth';A.eng.frequency.value=55;
    A.engF=c.createBiquadFilter();A.engF.type='lowpass';A.engF.frequency.value=380;
    A.engG=c.createGain();A.engG.gain.value=0;
    A.eng.connect(A.engF);A.engF.connect(A.engG);A.engG.connect(A.master);A.eng.start();
  }catch(e){A.ctx=null;}
}
function tone(f,dur,type,vol,slide,delay){
  if(!A.ctx||!save.sound)return;
  const c=A.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(A.master);o.start(t);o.stop(t+dur+0.05);
}
function noiseHit(dur,vol,freq,ftype,delay){
  if(!A.ctx||!save.sound)return;
  const c=A.ctx,t=c.currentTime+(delay||0),s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
  s.buffer=A.noise;fl.type=ftype||'lowpass';fl.frequency.value=freq||1000;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(A.master);s.start(t);s.stop(t+dur+0.05);
}

function buildSky(){
  const mat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
    uniforms:{uTop:{value:new THREE.Color(0x03041a)},uHor:{value:new THREE.Color(FOG)},uGlow:{value:new THREE.Color(0xff4fa8)}},
    vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:`uniform vec3 uTop,uHor,uGlow;varying vec3 vD;
      float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      void main(){float h=vD.y;vec3 c=mix(uHor,uTop,smoothstep(-0.02,0.42,h));
        c+=uGlow*exp(-abs(h-0.015)*26.0)*0.32;
        vec2 g=floor(vec2(atan(vD.x,vD.z)*160.0,h*260.0));
        float s=step(0.9965,h21(g))*smoothstep(0.08,0.5,h);
        c+=vec3(0.85,0.9,1.0)*s*0.9;
        gl_FragColor=vec4(c,1.0);}`});
  const sky=new THREE.Mesh(new THREE.SphereGeometry(520,32,16),mat);sky.renderOrder=-1;scene.add(sky);
}

function buildFloor(){
  floorMat=new THREE.ShaderMaterial({extensions:{derivatives:true},
    uniforms:{uOff:{value:0},uHalf:{value:HALF},uPulse:{value:0},uA:{value:new THREE.Color(0x46f2ff)},uB:{value:new THREE.Color(0xb98aff)},uFog:{value:new THREE.Color(FOG)}},
    vertexShader:'varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
    fragmentShader:`uniform float uOff,uHalf,uPulse;uniform vec3 uA,uB,uFog;varying vec3 vW;
      float grid(vec2 p){vec2 f=abs(fract(p-0.5)-0.5)/fwidth(p);return 1.0-min(min(f.x,f.y),1.0);}
      void main(){
        float z=vW.z+uOff;float ax=abs(vW.x);
        float on=1.0-smoothstep(uHalf-0.05,uHalf+0.05,ax);
        float gT=grid(vec2(vW.x/1.2,z/3.0));
        float gO=grid(vec2(vW.x/6.0,z/6.0));
        vec3 c=mix(vec3(0.025,0.028,0.085),vec3(0.05,0.06,0.17),on);
        c+=uA*gT*on*(0.42+uPulse*0.4);
        c+=uB*gO*(1.0-on)*0.2;
        c+=uA*exp(-abs(ax-uHalf)*5.0)*(1.05+uPulse);
        c+=uB*on*0.07*(1.0-ax/uHalf);
        float f=smoothstep(45.0,235.0,length(vW-cameraPosition));
        gl_FragColor=vec4(mix(c,uFog,f),1.0);}`});
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(160,480),floorMat);
  floor.rotation.x=-Math.PI/2;floor.position.z=-200;scene.add(floor);
}

/* particles */
const PN=900;let pGeo,pPos,pCol,pVel,pBase,pLife,pMax,pHead=0;
const tmpC=new (window.THREE?THREE.Color:Object)();
function buildParticles(){
  pPos=new Float32Array(PN*3);pCol=new Float32Array(PN*3);pVel=new Float32Array(PN*3);pBase=new Float32Array(PN*3);pLife=new Float32Array(PN);pMax=new Float32Array(PN);
  for(let i=0;i<PN;i++)pPos[i*3+1]=-60;
  pGeo=new THREE.BufferGeometry();
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
  const cv=document.createElement('canvas');cv.width=cv.height=64;const cx=cv.getContext('2d');
  const gr=cx.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');
  cx.fillStyle=gr;cx.fillRect(0,0,64,64);
  const mat=new THREE.PointsMaterial({size:0.34,map:new THREE.CanvasTexture(cv),vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(pGeo,mat);pts.frustumCulled=false;scene.add(pts);
}
function emit(x,y,z,col,n,spd,life,up){
  tmpC.setHex(col);
  for(let i=0;i<n;i++){
    const k=pHead;pHead=(pHead+1)%PN;const j=k*3;
    pPos[j]=x;pPos[j+1]=y;pPos[j+2]=z;
    const a=Math.random()*6.2832,b=Math.random()*2-1,r=Math.sqrt(1-b*b),s=spd*(0.35+Math.random()*0.65);
    pVel[j]=Math.cos(a)*r*s;pVel[j+1]=(b+(up||0))*s;pVel[j+2]=Math.sin(a)*r*s;
    pBase[j]=tmpC.r;pBase[j+1]=tmpC.g;pBase[j+2]=tmpC.b;
    pLife[k]=pMax[k]=life*(0.6+Math.random()*0.4);
  }
}
function updateParticles(dt,dz){
  const drag=Math.pow(0.12,dt);
  for(let k=0;k<PN;k++){
    if(pLife[k]<=0)continue;
    const j=k*3;pLife[k]-=dt;
    if(pLife[k]<=0){pPos[j+1]=-60;pCol[j]=pCol[j+1]=pCol[j+2]=0;continue;}
    pVel[j]*=drag;pVel[j+1]=pVel[j+1]*drag-3*dt;pVel[j+2]*=drag;
    pPos[j]+=pVel[j]*dt;pPos[j+1]+=pVel[j+1]*dt;pPos[j+2]+=pVel[j+2]*dt+dz;
    const a=pLife[k]/pMax[k];pCol[j]=pBase[j]*a;pCol[j+1]=pBase[j+1]*a;pCol[j+2]=pBase[j+2]*a;
  }
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;
}

/* speed lines */
const SL=64;let slPos,slData=[],slMat,slGeo;
function placeLine(d,z){
  if(Math.random()<0.7){d.x=(Math.random()<.5?-1:1)*(HALF+1.2+Math.random()*16);d.y=0.3+Math.random()*8;}
  else{d.x=(Math.random()*2-1)*HALF;d.y=4.5+Math.random()*5;}
  d.z=z;
}
function buildSpeedLines(){
  slPos=new Float32Array(SL*6);
  for(let i=0;i<SL;i++){const d={};placeLine(d,-Math.random()*180);slData.push(d);}
  slGeo=new THREE.BufferGeometry();slGeo.setAttribute('position',new THREE.BufferAttribute(slPos,3));
  slMat=new THREE.LineBasicMaterial({color:0xbfe9ff,transparent:true,opacity:.2,blending:THREE.AdditiveBlending,depthWrite:false});
  const ls=new THREE.LineSegments(slGeo,slMat);ls.frustumCulled=false;scene.add(ls);
}
function updateSpeedLines(dz,speed,boost){
  const len=1+speed*0.12+(boost?4:0);
  for(let i=0;i<SL;i++){
    const d=slData[i];d.z+=dz*1.7;
    if(d.z>12)placeLine(d,-120-Math.random()*70);
    const j=i*6;slPos[j]=d.x;slPos[j+1]=d.y;slPos[j+2]=d.z;slPos[j+3]=d.x;slPos[j+4]=d.y;slPos[j+5]=d.z-len;
  }
  slGeo.attributes.position.needsUpdate=true;
  slMat.opacity=clamp((speed-14)/50,0.06,0.55)+(boost?0.25:0);
}

/* post-processing */
function setupComposer(){
  if(composer){try{composer.renderTarget1.dispose();composer.renderTarget2.dispose();}catch(e){}}
  composer=null;
  if(save.quality!=='high'||!THREE.EffectComposer||!THREE.RenderPass||!THREE.UnrealBloomPass)return;
  try{
    composer=new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene,camera));
    composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),0.85,0.55,0.22));
  }catch(e){composer=null;}
}
function resize(){
  const w=innerWidth,h=innerHeight,pr=save.quality==='high'?Math.min(window.devicePixelRatio||1,1.75):1;
  renderer.setPixelRatio(pr);renderer.setSize(w,h,false);
  const a=w/h;camera.aspect=a;baseFov=a<0.7?84:a<1.1?76:64;camera.updateProjectionMatrix();
  if(composer){composer.setPixelRatio(pr);composer.setSize(w,h);}
}

/* ---------- entities ---------- */
function makeMesh(type){
  let m;
  if(type==='block'||type==='mover'){
    const isM=type==='mover';m=new THREE.Group();
    m.add(new THREE.Mesh(G.block,isM?M.mover:M.block));m.add(new THREE.LineSegments(G.blockEdges,isM?M.moverEdge:M.blockEdge));
  }else if(type==='crystal'){m=new THREE.Mesh(G.crystal,M.crystal);m.scale.set(1,1.5,1);}
  else if(type==='coin'){m=new THREE.Mesh(G.coin,M.coin);}
  else if(type==='ring'){m=new THREE.Mesh(G.ring,M.ring);}
  else{
    m=new THREE.Group();
    for(const s of[-1,1]){const p=new THREE.Mesh(G.box,M.gate);p.scale.set(.3,4.6,.3);p.position.set(s*(HALF+0.35),2.3,0);m.add(p);}
    const top=new THREE.Mesh(G.box,M.gate);top.scale.set(HALF*2+1,.25,.3);top.position.y=4.6;m.add(top);
    const pl=new THREE.Mesh(G.gatePlane,M.gatePlane);pl.position.y=2.3;m.add(pl);
  }
  scene.add(m);return m;
}
const YS={block:0.8,mover:0.8,crystal:0.95,coin:0.95,ring:1.3,gate:0};
function spawn(type,x,z,extra){
  const p=pools[type]||(pools[type]=[]);
  const m=p.pop()||makeMesh(type);m.visible=true;m.rotation.set(0,0,0);
  const e={type,mesh:m,x,y:YS[type],z,alive:true,passed:false,hit:false,t:Math.random()*6,row:rowId};
  if(extra)Object.assign(e,extra);
  m.position.set(e.x,e.y,e.z);ents.push(e);return e;
}
function release(e){e.mesh.visible=false;(pools[e.type]||(pools[e.type]=[])).push(e.mesh);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function wall(z,fill){
  for(let i=0;i<5;i++){
    if(fill.includes(i))spawn('block',SLOTS[i],z);
    else if(Math.random()<0.7)spawn('crystal',SLOTS[i],z);
  }
}
function spawnRow(z){
  const r=run,rowDist=r.dist-z;rowId++;
  if(rowDist>=r.nextCpAt){
    spawn('gate',0,z);r.nextCpAt+=450+r.cpSpawned*120;r.cpSpawned++;
    for(let i=1;i<=3;i++)spawn('crystal',0,z-i*2.5);
    return 16;
  }
  const D=Math.min(1,rowDist/3200);
  const gap=Math.max(13,r.speed*0.42)*(1.15-D*0.25);
  const W=[['wall',0.30+0.14*D],['pillars',0.20],['snake',0.20],['coins',0.12],['ring',0.07],['mover',D>0.12?0.10+0.1*D:0],['slalom',D>0.3?0.04+0.08*D:0]];
  let tot=0;for(const w of W)tot+=w[1];let roll=Math.random()*tot,pick='wall';
  for(const w of W){roll-=w[1];if(roll<=0){pick=w[0];break;}}
  switch(pick){
    case 'wall':{const n=Math.random()<0.25+0.45*D?4:3;wall(z,shuffle([0,1,2,3,4]).slice(0,n));return gap;}
    case 'pillars':{
      const k=Math.random()<0.4+0.4*D?2:1,sl=shuffle([0,1,2,3,4]);
      for(let i=0;i<k;i++)spawn('block',SLOTS[sl[i]],z);
      spawn(Math.random()<0.5?'crystal':'coin',SLOTS[sl[k]],z);
      return gap*0.85;}
    case 'snake':{
      const ph=Math.random()*6.28,amp=1.5+Math.random()*2.2;
      for(let i=0;i<6;i++)spawn('crystal',clamp(Math.sin(ph+i*0.55)*amp,-3.8,3.8),z-i*3);
      return 18+gap*0.6;}
    case 'coins':{
      const x=SLOTS[Math.floor(Math.random()*5)];
      for(let i=0;i<7;i++)spawn('coin',x,z-i*2.2);
      return 15.4+gap*0.6;}
    case 'ring':{
      const x=(Math.random()*2-1)*2.6;spawn('ring',x,z);
      for(let i=1;i<=3;i++)spawn('crystal',x,z-i*2.6);
      return gap+10;}
    case 'mover':{
      spawn('mover',(Math.random()*2-1)*1.6,z,{bx:(Math.random()*2-1)*1.6,amp:2.4,f:1.4+D*1.4,ph:Math.random()*6.28});
      return gap;}
    case 'slalom':{
      const left=Math.random()<0.5;
      wall(z,left?[2,3,4]:[0,1,2]);rowId++;
      const z2=z-9;
      for(let i=0;i<5;i++){const f=left?[0,1,2]:[2,3,4];if(f.includes(i))spawn('block',SLOTS[i],z2,{row:rowId});else spawn('crystal',SLOTS[i],z2);}
      return 9+gap;}
  }
  return gap;
}

/* ---------- run ---------- */
function newRun(){
  return{time:BASE_TIME+save.up.time*3,dist:0,score:0,speed:24,combo:0,mult:1,comboT:0,maxMult:1,crystals:0,coins:0,near:0,cps:0,boosts:0,
    shield:save.up.shield,invuln:0,boostT:0,slowT:0,nextCpAt:450,cpSpawned:0,done:{},missionCoins:0,beatBest:false,lastTick:99,mile:0,hits:0,nearRow:-1};
}
function addTime(v){run.time+=v;timeDelta(v);}
function addCombo(n){
  const r=run;r.combo+=n;r.comboT=COMBO_TIME;
  const m=Math.min(10,1+Math.floor(r.combo/COMBO_STEP));
  if(m>r.mult){r.mult=m;if(m>r.maxMult)r.maxMult=m;popup('x'+m,'t-gold');sfx.mult(m);retrigger(E.combo,'bump');}
}
function hitBlock(e,dx){
  const r=run;e.hit=true;e.vy=7+Math.random()*3;e.vx=(dx>=0?1:-1)*(3+Math.random()*3);e.spin=(Math.random()-.5)*10;
  emit(e.x,0.9,e.z,0xff5b4f,40,9,0.7,0.3);
  if(r.shield>0){r.shield--;r.invuln=0.7;popup('Shield','t-skin');sfx.shield();flash('rgba(127,246,255,.45)');shake=0.25;return;}
  r.time-=3;r.hits++;timeDelta(-3);r.invuln=1.1;r.slowT=0.7;
  if(r.mult>1)popup('Combo lost','t-danger');
  r.combo=0;r.mult=1;r.comboT=0;
  shake=0.6;flash('rgba(255,70,60,.55)');sfx.hit();vibrate(60);
}
function nearMiss(e){
  const r=run;r.near++;addTime(0.3);addCombo(1);r.score+=25*r.mult;

  emit(px+(e.x>px?0.9:-0.9),0.7,0.3,0xb98aff,14,5,0.4);
}
function collect(e){
  const r=run;e.alive=false;e.mesh.visible=false;
  if(e.type==='crystal'){
    r.crystals++;addTime(crystalVal(save.up.value));addCombo(1);r.score+=10*r.mult;sfx.crystal(r.combo);
    emit(e.x,e.y,e.z,0x46f2ff,14,4,0.5,0.4);
  }else{
    r.coins++;addCombo(1);r.score+=5*r.mult;sfx.coin();
    emit(e.x,e.y,e.z,0xffc84a,12,3.5,0.45,0.4);
  }
}
function takeRing(e){
  const r=run;r.boosts++;r.boostT=2.2;addTime(0.5);addCombo(3);r.score+=50*r.mult;
  popup('Boost','t-rift');sfx.boost();fovKick=12;
  emit(e.x,1.3,0.2,0xc08bff,50,8,0.6);

function checkpoint(){
  const r=run;r.cps++;const b=Math.max(2.5,6-(r.cps-1)*0.5);
  addTime(b);r.score+=100*r.mult;
  popup(`Checkpoint +${b.toFixed(1)}s`,'t-time big');sfx.checkpoint();flash('rgba(70,242,255,.32)');
  for(const s of[-1,1])emit(s*(HALF+0.35),2.5,0.3,0x46f2ff,36,7,0.7);

function statVal(stat){return stat==='dist'?Math.floor(run.dist):run[stat];}
function checkMissions(){
  for(const id of save.missions){
    if(run.done[id]!==undefined)continue;
    const m=mInfo(id);
    if(statVal(m.stat)>=m.target){run.done[id]=m.reward;run.missionCoins+=m.reward;toast(`<b>Mission complete</b>${m.text} · <span class="coin-dot"></span>+${m.reward}`);sfx.mission();}
  }
}

function gameTick(dt){
  const r=run;
  r.time-=dt*(1+r.dist/5000);
  r.invuln=Math.max(0,r.invuln-dt);r.boostT=Math.max(0,r.boostT-dt);r.slowT=Math.max(0,r.slowT-dt);
  const target=(26+Math.min(r.dist*0.011,36))*(r.boostT>0?1.45:1)*(r.slowT>0?0.62:1);
  r.speed+=(target-r.speed)*Math.min(1,dt*(r.boostT>0?6:2.5));
  const d=r.speed*dt;r.dist+=d;r.score+=d*r.mult;
  if(r.combo>0){r.comboT-=dt;if(r.comboT<=0){if(r.mult>1){r.mult--;r.combo=(r.mult-1)*COMBO_STEP;r.comboT=COMBO_TIME;}else{r.combo=0;r.comboT=0;}}}
  const mile=Math.floor(r.dist/500);if(mile>r.mile){r.mile=mile;popup(`${(mile*500).toLocaleString()} m`,'t-white');}
  if(!r.beatBest&&save.best>0&&r.score>save.best){r.beatBest=true;popup('New best!','t-gold big');sfx.best();emit(px,1,0,0xffc84a,60,9,0.9,0.5);}
  if(r.time<5){const s=Math.ceil(r.time);if(s<r.lastTick)sfx.tick(s);r.lastTick=s;}else r.lastTick=99;
  checkMissions();
  if(r.time<=0){r.time=0;state='ending';endT=0;sfx.timeUp();engine(false);popup('Time up','t-danger big');vibrate(120);}
}

function collide(dt){
  const r=run,mr=magnetR(save.up.magnet);
  for(const e of ents){
    if(!e.alive)continue;
    const dx=e.x-px,z=e.z;
    switch(e.type){
      case 'block':case 'mover':
        if(!e.hit&&r.invuln<=0&&Math.abs(z)<1.25&&Math.abs(dx)<1.3)hitBlock(e,dx);
        if(!e.passed&&z>1.3){e.passed=true;if(!e.hit&&r.invuln<=0&&Math.abs(dx)<2.15&&r.nearRow!==e.row){r.nearRow=e.row;nearMiss(e);}}
        break;
      case 'crystal':case 'coin':
        if(z>-9&&z<3){
          const d=Math.hypot(dx,z);
          if(mr>0&&d<mr){const k=Math.min(1,dt*9);e.x-=dx*k;e.z-=z*k;}
          if(d<1.05)collect(e);
        }
        break;
      case 'ring':if(!e.passed&&z>0){e.passed=true;if(Math.abs(dx)<1.35)takeRing(e);}break;
      case 'gate':if(!e.passed&&z>0){e.passed=true;checkpoint();}break;
    }
  }
}

function moveWorld(dz,dt){
  worldDist+=dz;
  for(let i=ents.length-1;i>=0;i--){
    const e=ents[i],m=e.mesh;e.z+=dz;e.t+=dt;
    if(e.type==='mover'&&!e.hit)e.x=e.bx+Math.sin(e.t*e.f+e.ph)*e.amp;
    if(e.hit){e.y+=e.vy*dt;e.vy-=26*dt;e.x+=e.vx*dt;m.rotation.x+=e.spin*dt;m.rotation.z+=e.spin*0.7*dt;}
    else if(e.type==='crystal'){m.rotation.y+=dt*2.6;e.y=0.95+Math.sin(e.t*3)*0.12;}
    else if(e.type==='coin')m.rotation.y+=dt*5;
    else if(e.type==='ring')m.rotation.z+=dt*1.2;
    m.position.set(e.x,e.y,e.z);
    if(e.z>16||!e.alive||e.y<-6){release(e);ents.splice(i,1);}
  }
  for(const t of towers){t.position.z+=dz;if(t.position.z>40){t.position.z-=440;t.position.x=t.userData.side*(11+Math.random()*34);}}
  for(const p of posts){p.position.z+=dz;if(p.position.z>14)p.position.z-=240;}
  floorMat.uniforms.uOff.value=-(worldDist%6);
  riftA.rotation.z+=dt*0.08;riftB.rotation.z-=dt*0.13;
}

function updateShip(dt,speed,boost){
  ship.position.x=px;ship.position.y=0.65+Math.sin(worldT*3)*0.05;
  const bank=clamp(-shipVx*0.06,-0.6,0.6);
  ship.rotation.z+=(bank-ship.rotation.z)*Math.min(1,dt*10);
  ship.rotation.y=clamp(-shipVx*0.012,-0.25,0.25);
  const f=0.7+speed/60+(boost?0.7:0)+Math.random()*0.15;flame.scale.set(1,f,1);
  const playing=state==='play'&&run;
  ship.visible=!(playing&&run.invuln>0&&Math.floor(worldT*20)%2===0);
  shieldMesh.visible=!!(playing&&run.shield>0);
  if(shieldMesh.visible){shieldMesh.rotation.y+=dt*1.5;shieldMesh.rotation.x+=dt*0.7;}
  if(dt>0){
    const col=(SKINS[save.skin]||SKINS[0]).color;
    emit(px,0.64,1.75,col,boost?4:2,0.5,0.32);
    emit(px-1.02,0.72,0.8,col,1,0.2,0.18);emit(px+1.02,0.72,0.8,col,1,0.2,0.18);
  }
}

function updateCamera(rdt,speed){
  const inPlay=state==='play'||state==='ending'||state==='pause';
  camBlend+=((inPlay?1:0)-camBlend)*Math.min(1,rdt*3);
  camBase.x+=(px*0.55*camBlend-camBase.x)*Math.min(1,rdt*6);
  let sx=0,sy=0;
  if(shake>0){const s=reduceMotion?shake*0.3:shake;sx=(Math.random()-.5)*s;sy=(Math.random()-.5)*s;shake=Math.max(0,shake-rdt*1.6);}
  camera.position.set(camBase.x+sx,lerp(2.3,3.7,camBlend)+sy,lerp(6.4,8.4,camBlend));
  camera.lookAt(camBase.x*0.5,lerp(1.7,1.0,camBlend),-14);
  fovKick=Math.max(0,fovKick-rdt*10);
  const sf=clamp((speed-20)/45,0,1);
  const tf=baseFov+sf*8*camBlend+fovKick*(reduceMotion?0.3:1);
  if(Math.abs(camera.fov-tf)>0.01){camera.fov+=(tf-camera.fov)*Math.min(1,rdt*5);camera.updateProjectionMatrix();}
}

let wakeLock=null;
function requestWake(){try{if(navigator.wakeLock&&!wakeLock)navigator.wakeLock.request('screen').then(l=>{wakeLock=l;l.addEventListener('release',()=>{wakeLock=null;});}).catch(()=>{});}catch(e){}}

function pauseGame(){if(state!=='play')return;state='pause';engine(false);E.pause.hidden=false;E.resumeBtn.focus();}

function showMenu(){E.results.hidden=true;E.pause.hidden=true;E.hud.hidden=true;E.menu.hidden=false;E.vig.style.opacity=0;renderMenu();}

function pickMission(active){
  const pool=Object.keys(MISSIONS).filter(k=>!active.includes(k));
  return pool[Math.floor(Math.random()*pool.length)];
}
function finishRun(){
  const r=run;state='results';engine(false);E.vig.style.opacity=0;
  const score=Math.floor(r.score),prevBest=save.best,newBest=score>prevBest;
  const oldLevel=save.level,oldXp=save.xp;
  const xpGain=Math.max(5,Math.round(score/10)+r.cps*15);
  if(newBest)save.best=score;
  save.bestDist=Math.max(save.bestDist,Math.floor(r.dist));save.runs++;
  let lvl=save.level,xp=save.xp+xpGain,levelCoins=0;const unlocked=[];
  while(xp>=xpNeed(lvl)){xp-=xpNeed(lvl);lvl++;levelCoins+=30;const sk=SKINS.find(s=>s.lvl===lvl);if(sk)unlocked.push(sk);}
  save.level=lvl;save.xp=xp;
  const earned=r.coins+r.missionCoins+levelCoins;save.coins+=earned;
  const completed=[];
  const active=save.missions.slice();
  for(let i=0;i<active.length;i++){
    const id=active[i];
    if(r.done[id]===undefined)continue;
    completed.push({text:mInfo(id).text,reward:r.done[id]});
    save.tiers[id]=(save.tiers[id]||0)+1;
    active[i]=pickMission(active);
  }
  save.missions=active;
  persist();

  E.hud.hidden=true;E.results.hidden=false;
  E.rKicker.textContent=r.hits===0?'Time up · no hits':'Time up';
  countUp(E.rScore,score,900);
  E.rBest.hidden=!newBest;
  E.rDist.textContent=Math.floor(r.dist).toLocaleString()+' m';
  E.rCrys.textContent=r.crystals;E.rNear.textContent=r.near;E.rMult.textContent='x'+r.maxMult;
  E.rCoins.textContent=earned.toLocaleString();
  const parts=[];if(r.coins)parts.push(`${r.coins} picked up`);if(r.missionCoins)parts.push(`${r.missionCoins} from missions`);if(levelCoins)parts.push(`${levelCoins} level bonus`);
  E.rCoinsNote.textContent=parts.join(' · ');
  E.rMissions.innerHTML=completed.map(c=>`<li>${c.text} <span class="t-gold">+${c.reward}</span></li>`).join('');
  E.rMissions.hidden=!completed.length;
  E.rLevelUp.hidden=true;
  animateXP(oldLevel,oldXp,xpGain,unlocked);

  const lines=[];
  if(newBest&&prevBest>0)lines.push(`New best by <b>${(score-prevBest).toLocaleString()}</b> points.`);
  else if(newBest)lines.push('First score on the board. Now beat it.');
  else lines.push(`<b>${(prevBest-score).toLocaleString()}</b> points short of your best.`);
  const aff=UPG.find(u=>save.up[u.id]<u.max&&save.coins>=upCost(u,save.up[u.id]));
  if(aff)lines.push(`You can afford <b>${aff.name}</b> in the garage.`);
  else{const ns=SKINS.find(s=>s.lvl>save.level);if(ns)lines.push(`Level ${ns.lvl} unlocks the <b>${ns.name}</b> ship.`);}
  E.rNext.innerHTML=lines.join(' ');
  setTimeout(()=>{try{E.againBtn.focus({preventScroll:true});}catch(e){}},50);
}
function countUp(el,to,ms){
  const t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=Math.floor(to*e).toLocaleString();if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function tweenBar(el,from,to,ms,done){
  const t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,2);el.style.width=(lerp(from,to,e)*100)+'%';if(k<1)requestAnimationFrame(step);else done();};
  requestAnimationFrame(step);
}
function animateXP(lvl,xp,gain,unlocked){
  let left=gain;
  E.rLevel.textContent=lvl;E.rXpGain.textContent=`+${gain} XP`;E.rXpText.textContent=`${Math.floor(xp)} / ${xpNeed(lvl)}`;
  E.rXpFill.style.width=(xp/xpNeed(lvl)*100)+'%';
  const step=()=>{
    const need=xpNeed(lvl),take=Math.min(left,need-xp);
    tweenBar(E.rXpFill,xp/need,(xp+take)/need,300+600*take/need,()=>{
      xp+=take;left-=take;
      if(xp>=need-1e-6){
        lvl++;xp=0;E.rLevel.textContent=lvl;E.rXpFill.style.width='0%';
        const sk=unlocked.find(s=>s.lvl===lvl);
        E.rLevelUp.textContent=`Level ${lvl}!  +30 coins`+(sk?` · ${sk.name} ship unlocked`:'');
        E.rLevelUp.hidden=false;retrigger(E.rLevelUp,'levelup');
        sfx.levelUp();flash('rgba(255,200,74,.3)');emit(px,1,0,0xffc84a,80,10,1,0.6);
      }
      E.rXpText.textContent=`${Math.floor(xp)} / ${xpNeed(lvl)}`;
      if(left>1e-6)setTimeout(step,lvl>0?120:0);
    });
  };
  setTimeout(step,500);
}

/* ---------- menu ---------- */
let tab='upgrades';
function renderMenu(){
  const need=xpNeed(save.level);
  E.mLevel.textContent=save.level;
  E.mXpText.textContent=`${Math.floor(save.xp)} / ${need} XP`;
  E.mXpFill.style.width=(save.xp/need*100)+'%';
  E.mCoins.textContent=save.coins.toLocaleString();
  E.mBest.textContent=save.best?`Best ${save.best.toLocaleString()}`:'No runs yet';
  E.soundBtn.textContent=save.sound?'Sound on':'Sound off';E.soundBtn.setAttribute('aria-pressed',String(save.sound));
  E.qualityBtn.textContent=save.quality==='high'?'Graphics: high':'Graphics: fast';
  const afford=UPG.some(u=>save.up[u.id]<u.max&&save.coins>=upCost(u,save.up[u.id]));
  E.tabUp.innerHTML='Upgrades'+(afford?'<span class="dot" aria-label="upgrade available"></span>':'');
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  let h='';
  if(tab==='upgrades'){
    h=UPG.map(u=>{
      const l=save.up[u.id],maxed=l>=u.max,cost=upCost(u,l),can=!maxed&&save.coins>=cost;
      const pips=Array.from({length:u.max},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('');
      return `<div class="row"><div class="row-main"><div class="row-title">${u.name}</div><div class="row-sub">${u.desc(l)}</div><div class="pips">${pips}</div></div>`+
        `<button class="buy num ${maxed?'max':''}" data-up="${u.id}" ${can?'':'disabled'} aria-label="${maxed?u.name+' maxed':'Buy '+u.name+' for '+cost+' coins'}">${maxed?'Max':`<span class="coin-dot"></span>${cost}`}</button></div>`;
    }).join('');
  }else if(tab==='ships'){
    h='<div class="ships">'+SKINS.map((s,i)=>{
      const locked=save.level<s.lvl,eq=save.skin===i;
      return `<button class="ship ${eq?'eq':''}" data-skin="${i}" ${locked?'disabled':''} style="--c:${s.css}"><span class="chev"></span><span class="ship-name">${s.name}</span><span class="ship-state">${locked?'Level '+s.lvl:eq?'Equipped':'Select'}</span></button>`;
    }).join('')+'</div>';
  }else{
    h=save.missions.map(id=>{const m=mInfo(id);return `<div class="mis"><div class="mis-text">${m.text}</div><div class="mis-reward num"><span class="coin-dot"></span>${m.reward}</div></div>`;}).join('')+
      '<p class="note">Missions finish mid-run. Complete one and a harder one takes its place.</p>';
  }
  E.panel.innerHTML=h;
}
function buy(id){
  const u=UPG.find(x=>x.id===id),l=save.up[id],cost=upCost(u,l);
  if(l>=u.max||save.coins<cost)return;
  save.coins-=cost;save.up[id]++;persist();sfx.buy();
  emit(px,1,0,0x46f2ff,50,7,0.8,0.5);renderMenu();
}

/* ---------- input ---------- */
let dragId=null,lastPX=0;
addEventListener('pointerdown',e=>{
  audioInit();
  if(state!=='play'||e.target.closest('button'))return;
  dragId=e.pointerId;lastPX=e.clientX;hideHint();
});
addEventListener('pointermove',e=>{
  if(state!=='play'||e.pointerId!==dragId)return;
  const dx=e.clientX-lastPX;lastPX=e.clientX;
  targetX=clamp(targetX+dx*(HALF*2)/(Math.min(innerWidth,700)*0.5),-HALF+0.7,HALF-0.7);
});
const endDrag=e=>{if(e.pointerId===dragId)dragId=null;};
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){keys.l=true;if(state==='play'){e.preventDefault();hideHint();}}
  else if(k==='ArrowRight'||k==='d'||k==='D'){keys.r=true;if(state==='play'){e.preventDefault();hideHint();}}
  else if(k==='Escape'||k==='p'||k==='P'){if(state==='play')pauseGame();else if(state==='pause')resumeGame();}
});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=false;if(k==='ArrowRight'||k==='d'||k==='D')keys.r=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame();});
addEventListener('blur',()=>{keys.l=keys.r=false;});

E.playBtn.addEventListener('click',startRun);
E.againBtn.addEventListener('click',startRun);
E.menuBtn.addEventListener('click',()=>{sfx.tap();showMenu();});
E.pauseBtn.addEventListener('click',pauseGame);
E.resumeBtn.addEventListener('click',resumeGame);
E.endBtn.addEventListener('click',()=>{if(state!=='pause')return;E.pause.hidden=true;finishRun();});
E.soundBtn.addEventListener('click',()=>{save.sound=!save.sound;persist();audioInit();if(A.master)A.master.gain.value=save.sound?0.55:0;sfx.tap();renderMenu();});
E.qualityBtn.addEventListener('click',()=>{save.quality=save.quality==='high'?'fast':'high';persist();setupComposer();resize();sfx.tap();renderMenu();});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;sfx.tap();renderMenu();}));
E.panel.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.up)buy(b.dataset.up);
  else if(b.dataset.skin!==undefined){save.skin=+b.dataset.skin;applySkin();persist();sfx.tap();emit(px,1,0,(SKINS[save.skin]).color,40,6,0.7,0.5);renderMenu();}
});

/* auto-drop to fast graphics if frames are slow */
const perf={acc:0,n:0,t:0,reset(){this.acc=0;this.n=0;this.t=0;},sample(dt){
  if(save.quality!=='high'||state!=='play')return;
  this.acc+=dt;this.n++;this.t+=dt;
  if(this.t>3){const avg=this.acc/this.n;if(avg>1/32){save.quality='fast';persist();setupComposer();resize();toast('<b>Graphics</b>Switched to fast mode for smoother play');}this.reset();}
}};

/* ---------- loop ---------- */
let last=performance.now();
function update(rdt){
  if(state==='ending'){endT+=rdt;timeScale=Math.max(0.06,1-endT*1.1);if(endT>1.25)finishRun();}
  else timeScale+=(1-timeScale)*Math.min(1,rdt*4);
  const dt=rdt*timeScale;worldT+=dt;
  const active=run&&(state==='play'||state==='ending');
  if(state==='play')gameTick(dt);
  const speed=active?run.speed:14;
  const boost=!!(active&&run.boostT>0);
  const dz=speed*dt;
  if(state==='play'){
    if(keys.l)targetX-=14*rdt;if(keys.r)targetX+=14*rdt;
    targetX=clamp(targetX,-HALF+0.7,HALF-0.7);
  }else if(state!=='ending')targetX=Math.sin(worldT*0.55)*1.4;
  prevPx=px;px+=(targetX-px)*Math.min(1,dt*16);
  shipVx=dt>0?(px-prevPx)/dt:0;
  moveWorld(dz,dt);
  if(state==='play')collide(dt);
  if(active){spawnZ+=dz;while(spawnZ>-SPAWN_DIST)spawnZ-=spawnRow(spawnZ);}
  floorMat.uniforms.uPulse.value+=((boost?0.8:0)-floorMat.uniforms.uPulse.value)*Math.min(1,rdt*5);
  riftGlowMat.uniforms.uI.value=1+(boost?0.5:0)+Math.sin(worldT*1.3)*0.08;
  updateShip(dt,speed,boost);
  updateParticles(dt,dz);
  updateSpeedLines(dz,speed,boost);
  updateCamera(rdt,speed);
  engineTune(rdt,speed);
  if(active)updateHUD();
  perf.sample(rdt);
}
function frame(now){
  requestAnimationFrame(frame);
  const rdt=Math.min(0.05,(now-last)/1000);last=now;
  if(state!=='pause')update(rdt);
  if(composer)composer.render();else renderer.render(scene,camera);
}

function start(data){
  loadSave(data||{});
  if(!window.THREE){E.boot.textContent="The 3D engine didn't load. Check your connection and reload the page.";return;}
  try{initGL();}catch(err){E.boot.textContent="This device couldn't start 3D graphics. Try another browser.";return;}
  E.boot.hidden=true;
  state='menu';showMenu();
  last=performance.now();requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.snapshot==='function'){try{hot.snapshot(()=>({save}));}catch(e){}}
if(hot&&typeof hot.ready==='function')hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
